name: Lifts
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  Lifts:
    type: application
    platform: iOS
    sources: [Lifts]
    settings:
      base:
        MARKETING_VERSION: "1.3.0"
        CURRENT_PROJECT_VERSION: 41
  LiftsTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LiftsTests]
    dependencies:
      - target: Lifts
